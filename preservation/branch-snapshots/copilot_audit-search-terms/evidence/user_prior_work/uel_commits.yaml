layers:
  D1_foundation:
    description: >
      First commit cluster reported 2025-12-19. Establishes core LRE (Law of Residual
      Emergence) axioms, framework documentation, Lean/Isabelle/HOL formalizations,
      fiber-bundle / curvature / closure-theorem scaffolding, and first explicit coupling
      of LRE operators to Navier-Stokes. Also records UIA-LRE bridge and quantitative
      closure obstruction merge chains (PR #33, #35, #36).
    earliest_reported_date: 2025-12-19
    key_concepts:
      - Law of Structural Residue
      - LRE axioms
      - LRE operators applied to NS
      - Lean/Isabelle/HOL formalization scaffolding
      - fiber bundles / curvature / closure theorem
      - quantitative closure obstruction

  D2_geometric_coupling:
    description: >
      Geometric coupling layer. Introduces explicit residue-curvature-holonomy language,
      CurvatureTheory and CouplingCurvature modules, and the key evolution law
      d/dt π(u) = F(π(u)) + K(R(u), π(u)).
      Culminates in Merge PR #37 classifying the residual as Ehresmann curvature.
    earliest_reported_date: UNKNOWN
    key_concepts:
      - LRE quantitative dynamics
      - explicit residue, curvature, holonomy
      - CurvatureTheory module
      - CouplingCurvature module
      - Ehresmann connection / residual as curvature
      - projected evolution law with residual feedback

  D3_ns_geometric_decomp:
    description: >
      Geometric Navier-Stokes decomposition layer — the most forensically significant
      cluster for the NS priority claim. Contains the GitHub-verified commit
      730aa849... which creates docs/lre-navier-stokes-geometric.md and formalizes:
        u = C(u) + D(u) = π(u) + R(u)
        P_N[(u·∇)u] ≠ (P_N u)·∇(P_N u)
        T(u_N, u_⊥) = cross-frequency interaction operator
      Also includes explicit quantitative obstruction formalization and nonlinear closure
      review/fix commits.
    earliest_reported_date: UNKNOWN
    key_concepts:
      - C/D/pi/R four-part decomposition
      - nonlinearity non-commutativity with projection
      - cross-frequency interaction tensor T
      - Theorem 1 formalization
      - quantitative closure obstruction
      - docs/lre-navier-stokes-geometric.md

  D4_residual_stability:
    description: >
      Residual stability layer. Develops the NS Residual Stability Inequality across
      three phases, ODE-level residual stability, holonomy connections, and Lean
      formalization of the inequality. Multiple merge chains (PR #49–54) indicate
      an active branch-and-review workflow during this period.
    earliest_reported_date: UNKNOWN
    key_concepts:
      - Residual Stability Inequality
      - phase 1/2/3 stability architecture
      - ODE ResidualStability
      - holonomy in residual stability context
      - Lean proof of stability inequality

  D5_proof_framework:
    description: >
      Proof-framework and NS reformulation layer. Introduces LRE core ontology,
      NS κ-reformulation, comprehensive proof framework linking LRE to NS, and
      merge chains for complete NS/LRE application (PR #42, #46, #56).
    earliest_reported_date: UNKNOWN
    key_concepts:
      - LRE core ontology
      - NS κ reformulation
      - complete NS/LRE proof framework
      - blow-up via residual curvature (PR #56)

  D6_lre_uc_rbc:
    description: >
      LRE-UC (Universal Convergence) and RBC (Residual Barrier Conjecture) layer.
      Adds Lean/Coq/Isabelle/Agda multi-language infrastructure, Universal Problem + RBC
      module, and shell-model verification. Merge chains PR #67–74 indicate active
      four-language proof infrastructure.
    earliest_reported_date: UNKNOWN
    key_concepts:
      - LRE-UC
      - RBC theorem
      - four proof assistants (Lean/Coq/Isabelle/Agda)
      - shell-model verification
      - HCS-RBC operational implementation

