name: Audit integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests for audit invariants and certificate pipeline
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Syntax-check certificate and state-machine tools
        run: |
          python -m py_compile tools/scan_sorry_certificates.py
          python -m py_compile tools/classify_gap_obligations.py
          python -m py_compile tools/resolution_state_machine.py

      - name: Validate canonical open-bridge registry
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('data/open_bridge_registry.csv')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert rows, 'open bridge registry is empty'
          ids = [r['bridge_id'] for r in rows]
          assert len(ids) == len(set(ids)), 'duplicate bridge IDs'
          allowed = {'PROVED','CONDITIONAL','EXTERNAL_THEOREM','OPEN_BRIDGE','INCONSISTENT_SPECIFICATION','NOT_ESTABLISHED'}
          assert all(r['current_status'] in allowed for r in rows)
          assert any(r['bridge_id'] == 'NS-B2' and r['current_status'] == 'OPEN_BRIDGE' for r in rows)
          assert any(r['bridge_id'] == 'PRIORITY-B1' and r['current_status'] == 'OPEN_BRIDGE' for r in rows)
          print(f'validated {len(rows)} endpoint obligations')
          PY

      - name: Static audit-package integrity scan
        run: python scripts/audit_integrity.py > audit-integrity-report.txt

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean audit library
        working-directory: formal/lean
        run: |
          lake build
          lake env lean CriticalBarrier/BridgeLogic.lean
          lake env lean CriticalBarrier/NumericClassAudit.lean
          lake env lean CriticalBarrier/EndpointInterfaces.lean
          lake env lean CriticalBarrier/ResolutionDynamics.lean
          lake env lean CriticalBarrier/CriticalTailBridge.lean
          lake env lean CriticalBarrier/B2ScalarResidualCounterexample.lean
          lake env lean CriticalBarrier/CompleteClosureTargets.lean
          grep -RInE '\bsorry\b|\baxiom\b' CriticalBarrier/BridgeLogic.lean CriticalBarrier/NumericClassAudit.lean CriticalBarrier/EndpointInterfaces.lean CriticalBarrier/ResolutionDynamics.lean CriticalBarrier/CriticalTailBridge.lean CriticalBarrier/B2ScalarResidualCounterexample.lean CriticalBarrier/CompleteClosureTargets.lean && exit 1 || true

      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq

      - name: Compile Coq audit modules
        run: |
          coqc formal/coq/BridgeLogic.v
          coqc formal/coq/ResolutionDynamics.v
          coqc formal/coq/CompleteClosureTargets.v
          grep -nE '\bAdmitted\b|\badmit\b|\bAxiom\b' formal/coq/BridgeLogic.v formal/coq/ResolutionDynamics.v formal/coq/CompleteClosureTargets.v && exit 1 || true

      - name: Record unexecuted prover scope
        run: |
          printf '%s\n' \
            'Isabelle: SOURCE_PRESENT_NOT_EXECUTED_IN_THIS_WORKFLOW' \
            'Agda: SOURCE_PRESENT_NOT_EXECUTED_IN_THIS_WORKFLOW' \
            > multiprover-scope.txt

      - name: Show integrity report
        if: always()
        run: |
          cat audit-integrity-report.txt || true
          cat multiprover-scope.txt || true

      - name: Upload integrity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-integrity-report
          path: |
            audit-integrity-report.txt
            multiprover-scope.txt
