name: Audit integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests for audit invariants and certificate pipeline
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee unittest.log

      - name: Syntax-check certificate and state-machine tools
        continue-on-error: true
        run: |
          set -o pipefail
          (python -m py_compile tools/scan_sorry_certificates.py && python -m py_compile tools/classify_gap_obligations.py && python -m py_compile tools/resolution_state_machine.py) 2>&1 | tee python-syntax.log

      - name: Validate canonical open-bridge registry
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee registry.log
          import csv
          from pathlib import Path
          p = Path('data/open_bridge_registry.csv')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert rows, 'open bridge registry is empty'
          ids = [r['bridge_id'] for r in rows]
          assert len(ids) == len(set(ids)), 'duplicate bridge IDs'
          allowed = {'PROVED','CONDITIONAL','EXTERNAL_THEOREM','OPEN_BRIDGE','INCONSISTENT_SPECIFICATION','NOT_ESTABLISHED'}
          assert all(r['current_status'] in allowed for r in rows)
          assert any(r['bridge_id'] == 'NS-B2' and r['current_status'] == 'OPEN_BRIDGE' for r in rows)
          assert any(r['bridge_id'] == 'PRIORITY-B1' and r['current_status'] == 'OPEN_BRIDGE' for r in rows)
          print(f'validated {len(rows)} endpoint obligations')
          PY

      - name: Static audit-package integrity scan
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/audit_integrity.py 2>&1 | tee audit-integrity-report.txt

      - name: Install Lean toolchain
        continue-on-error: true
        run: |
          set -o pipefail
          (curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y) 2>&1 | tee lean-install.log
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean audit library and closure targets
        continue-on-error: true
        working-directory: formal/lean
        run: |
          set -o pipefail
          {
            lake build
            lake env lean CriticalBarrier/BridgeLogic.lean
            lake env lean CriticalBarrier/NumericClassAudit.lean
            lake env lean CriticalBarrier/EndpointInterfaces.lean
            lake env lean CriticalBarrier/ResolutionDynamics.lean
            lake env lean CriticalBarrier/CriticalTailBridge.lean
            lake env lean CriticalBarrier/B2ScalarResidualCounterexample.lean
            lake env lean CriticalBarrier/CompleteClosureTargets.lean
            lake env lean CriticalBarrier/B2_8_AlignmentTarget.lean
            lake env lean CriticalBarrier/B2_ChainTarget.lean
            lake env lean Millennium/AllClosureTargets.lean
          } 2>&1 | tee ../../lean-build.log

      - name: Scan Lean target sources for proof escapes
        continue-on-error: true
        run: |
          set -o pipefail
          if grep -RInE '\bsorry\b|\baxiom\b' formal/lean/CriticalBarrier/B2_8_AlignmentTarget.lean formal/lean/CriticalBarrier/B2_ChainTarget.lean formal/lean/Millennium/AllClosureTargets.lean > lean-proof-escape.log; then cat lean-proof-escape.log; exit 1; else echo CLEAN | tee lean-proof-escape.log; fi

      - name: Install Coq
        continue-on-error: true
        run: |
          set -o pipefail
          (sudo apt-get update && sudo apt-get install -y coq) 2>&1 | tee coq-install.log

      - name: Compile Coq audit modules and B2 target
        continue-on-error: true
        run: |
          set -o pipefail
          {
            coqc formal/coq/BridgeLogic.v
            coqc formal/coq/ResolutionDynamics.v
            coqc formal/coq/CompleteClosureTargets.v
            coqc formal/coq/B2_8_AlignmentTarget.v
          } 2>&1 | tee coq-build.log

      - name: Scan Coq target for proof escapes
        continue-on-error: true
        run: |
          set -o pipefail
          if grep -nE '\bAdmitted\b|\badmit\b|\bAxiom\b' formal/coq/B2_8_AlignmentTarget.v > coq-proof-escape.log; then cat coq-proof-escape.log; exit 1; else echo CLEAN | tee coq-proof-escape.log; fi

      - name: Record unexecuted prover scope
        run: |
          printf '%s\n' 'Isabelle: SOURCE_PRESENT_NOT_EXECUTED_IN_THIS_WORKFLOW' 'Agda: SOURCE_PRESENT_NOT_EXECUTED_IN_THIS_WORKFLOW' > multiprover-scope.txt

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-diagnostics
          path: |
            *.log
            audit-integrity-report.txt
            multiprover-scope.txt
