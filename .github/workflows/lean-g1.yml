name: Lean G1 audit

on:
  push:
    branches:
      - audit/pde-to-dynamic-campanato-20260913
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean/Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Lake dependencies
        shell: bash
        run: lake update
      - name: Build weak-derivative bridge
        shell: bash
        run: lake build G1.WeakDerivBridge
      - name: Build vector local representative
        shell: bash
        run: lake build G1.VectorLocalRep
      - name: Build weak omega bridge
        shell: bash
        run: lake build G1.WeakOmegaBridge
      - name: Build ball mean bound
        shell: bash
        run: lake build G1.BallMeanBound
      - name: Build weak omega slice interface
        shell: bash
        run: lake build G1.WeakOmegaSliceInterface
      - name: Build spacetime coordinate split
        shell: bash
        run: lake build G1.SpaceTimeCoordinateSplit
      - name: Build canonical spacetime spatial directions
        shell: bash
        run: lake build G1.SpaceTimeSpatialDirection
      - name: Build spacetime integral transport
        shell: bash
        run: lake build G1.SpaceTimeIntegralTransport
      - name: Build tensor-product Schwartz test
        shell: bash
        run: lake build G1.TensorProductSchwartz
      - name: Build tensor-product spatial derivative
        shell: bash
        run: lake build G1.TensorProductSpatialDerivative
      - name: Build 4D weak omega pairing
        shell: bash
        run: lake build G1.WeakOmega4DPairing
      - name: Build product-space weak omega pairing
        shell: bash
        run: lake build G1.WeakOmegaProductPairing
      - name: Build weak omega spatial slice reduction
        shell: bash
        run: lake build G1.WeakOmegaSpatialSlice
      - name: Build Hminus1-H10 weighted diffusion layer
        shell: bash
        run: lake build G1.WeakDiffusionIBP
      - name: Build weak XiEps PDE
        shell: bash
        run: lake build G1.XiEpsPDE
      - name: Build localized XiEps realization
        shell: bash
        run: lake build G1.XiEpsLocalizedRealization
      - name: Build tensorial strain-kernel architecture
        shell: bash
        run: lake build G1.StrainKernel
      - name: Build strain-kernel moment parity layer
        shell: bash
        run: lake build G1.StrainKernelMoments
      - name: Build signed far-field target
        shell: bash
        run: lake build G1.SignedFarField
      - name: Build Campanato arithmetic layer
        shell: bash
        run: lake build G1.DynamicCampanatoArithmetic
