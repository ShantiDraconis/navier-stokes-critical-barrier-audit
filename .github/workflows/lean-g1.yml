name: Lean G1 audit

on:
  push:
    branches:
      - audit/pde-to-dynamic-campanato-20260913
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean/Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Lake dependencies
        shell: bash
        run: lake update
      - name: Build weak-derivative bridge
        shell: bash
        run: lake build G1.WeakDerivBridge
      - name: Build vector local representative
        shell: bash
        run: lake build G1.VectorLocalRep
      - name: Build weak omega bridge
        shell: bash
        run: lake build G1.WeakOmegaBridge
      - name: Build Hminus1-H10 weighted diffusion layer
        shell: bash
        run: lake build G1.WeakDiffusionIBP
      - name: Build weak XiEps PDE
        shell: bash
        run: lake build G1.XiEpsPDE
      - name: Build localized XiEps realization
        shell: bash
        run: lake build G1.XiEpsLocalizedRealization
